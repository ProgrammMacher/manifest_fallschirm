{# Einheitlicher Hinweis fuer Stammdaten-Seiten ohne Admin-Rechte (reine Darstellung, keine Rechtepruefung). #}
{% if not session.is_admin %}
<div class="alert alert-secondary d-flex align-items-center gap-2 mb-3" role="status">
  <i class="bi bi-eye" aria-hidden="true"></i>
  <div>Nur Ansicht – keine Änderungen möglich. Bitte als Administrator anmelden.</div>
</div>
{% endif %}
