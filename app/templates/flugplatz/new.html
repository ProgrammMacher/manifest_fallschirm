{% extends "base.html" %}
{% block title %}Neuer Flugplatz{% endblock %}
{% block header %}Neuen Flugplatz anlegen{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h4 class="fw-bold mb-3">
            <i class="bi bi-geo-alt-fill"></i> Neuer Flugplatz
        </h4>

        <form method="POST" class="row g-3">

            <!-- Name -->
            <div class="col-md-12">
                <label class="form-label fw-bold">
                    <i class="bi bi-fonts me-1"></i> Name *
                </label>
                <input type="text"
                       name="name"
                       class="form-control"
                       required>
            </div>

            <!-- Heimatflugplatz -->
            <div class="col-md-12">
                <div class="form-check form-switch mt-2">
                    <input class="form-check-input"
                           type="checkbox"
                           name="is_home"
                           id="is_home">
                    <label class="form-check-label fw-bold" for="is_home">
                        <i class="bi bi-house-door-fill me-1"></i> Heimatflugplatz
                    </label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="col-12 mt-4 d-flex justify-content-between">
                <a href="{{ url_for('flugplatz.list_flugplaetze') }}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Abbrechen
                </a>

                <button class="btn btn-primary">
                    <i class="bi bi-check2-circle"></i> Speichern
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
