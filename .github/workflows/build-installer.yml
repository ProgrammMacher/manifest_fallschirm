name: Build Manifest Installer

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up matching CPython launcher
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          architecture: "x64"

      - name: Provision portable runtime launcher files
        shell: pwsh
        env:
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $sourcePython = $env:SETUP_PYTHON_PATH
          if (-not (Test-Path -LiteralPath $sourcePython -PathType Leaf)) {
            throw "setup-python did not provide python.exe: $sourcePython"
          }

          $sourceDir = Split-Path -Parent $sourcePython
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $runtimeLib = Join-Path $runtimeDir 'Lib'
          if (-not (Test-Path -LiteralPath $runtimeLib -PathType Container)) {
            throw "Checked-in portable Python library tree is missing: $runtimeLib"
          }

          $pythonwSource = Join-Path $sourceDir 'pythonw.exe'
          if (-not (Test-Path -LiteralPath $pythonwSource -PathType Leaf)) {
            throw "setup-python did not provide pythonw.exe: $pythonwSource"
          }

          Copy-Item -LiteralPath $sourcePython -Destination (Join-Path $runtimeDir 'python.exe') -Force
          Copy-Item -LiteralPath $pythonwSource -Destination (Join-Path $runtimeDir 'pythonw.exe') -Force

          $portablePython = Join-Path $runtimeDir 'python.exe'
          $version = (& $portablePython --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Python 3.14.2') {
            throw "Portable runtime version mismatch: $version"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir 'python314.dll') -PathType Leaf)) {
            throw 'Matching python314.dll is missing from the checked-in runtime tree.'
          }

          # No venv probe here: the bundled runtime must be fully self-contained
          # (all offline wheels installed directly into its site-packages by
          # tools/build_offline_compiled_installer_zip.ps1), so pip must be usable.
          & $portablePython -m pip --version
          if ($LASTEXITCODE -ne 0) {
            throw 'The provisioned portable runtime cannot run pip (required to bake offline dependencies into the runtime).'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build through the local offline installer wrapper
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\build_inno_offline_setup.ps1" -ProjectRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw "Offline installer build failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath 'build\installer\manifest_ou_1_2.exe' -PathType Leaf)) {
            throw 'Expected installer build\installer\manifest_ou_1_2.exe was not produced.'
          }

      - name: Verify packaged offline ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem -LiteralPath 'build' -Filter 'manifest_offline_compiled_installer_*.zip' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) { throw 'Compiled offline ZIP was not produced.' }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\', '/') })
            $required = @(
              'app/__init__.pyc',
              'app/services/neutral_install_seed.pyc',
              'migrations/env.pyc',
              'manifest_launcher.pyc',
              'run_migrations.pyc',
              'runtime/python/python.exe',
              'runtime/python/pythonw.exe',
              'runtime/gtk/bin/libcairo-2.dll',
              'setup_start_manifest.bat',
              'start_manifest_prod.bat',
              'start_manifest_prod.vbs',
              'requirements.txt'
            )
            foreach ($path in $required) {
              if ($entries -notcontains $path) { throw "Required installer content missing: $path" }
            }
            if (-not ($entries | Where-Object { $_ -match '^packages/.+\.whl$' })) {
              throw 'No offline wheels are present in the compiled ZIP.'
            }
            if (-not ($entries | Where-Object { $_ -match '^runtime/python/Lib/site-packages/cryptography(-|/)' })) {
              throw 'cryptography was not baked into the bundled runtime (required for license/secrets provisioning without a venv).'
            }
            if (-not ($entries | Where-Object { $_ -match '^runtime/python/Lib/site-packages/flask(-|/)' })) {
              throw 'flask was not baked into the bundled runtime.'
            }

            $forbidden = @(
              '(^|/)data/',
              '(^|/)runtime/(data|logs|session_data|uploads|secrets)/',
              '(^|/)logs/',
              '(^|/)session_data/',
              '(^|/)uploads/',
              '(^|/)noch_zu_loeschen/',
              '(^|/)app_settings\.json$',
              '(^|/)auth_config\.json$',
              '\.(db|sqlite|sqlite3)$',
              '\.log$',
              '(^|/)runtime/gtk/var/cache/'
            )
            foreach ($entry in $entries) {
              foreach ($pattern in $forbidden) {
                if ($entry -match $pattern) { throw "Forbidden local/runtime data packaged: $entry" }
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-installer-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/installer/manifest_ou_1_2.exe
          if-no-files-found: error
          retention-days: 30
