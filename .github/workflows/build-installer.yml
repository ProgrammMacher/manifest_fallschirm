name: Build Manifest Installer

permissions:
  contents: write
  
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # ✅ Clean (PowerShell korrekt)
      - name: Clean build
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Build EXE
        run: pyinstaller --clean --onefile --noconfirm run.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      # ✅ StageDir vorbereiten + INHALT (WICHTIG!)
      - name: Prepare stage directory with files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build\inno_stage

          # EXE kopieren
          Copy-Item dist\run.exe build\inno_stage\ -Force

          # Startskript kopieren
          Copy-Item start_manifest_prod.vbs build\inno_stage\ -Force -ErrorAction SilentlyContinue

          # App-Ordner kopieren (falls vorhanden)
          if (Test-Path app) {
            Copy-Item app build\inno_stage\ -Recurse -Force
          }

          # Tools kopieren (falls gebraucht)
          if (Test-Path tools) {
            Copy-Item tools build\inno_stage\ -Recurse -Force
          }

      # ✅ Richtiger Pfad zu deiner ISS
      - name: Build Installer
        shell: powershell
        run: |
          $issPath = "installer/inno/manifest_offline_setup.iss"

          if (Test-Path $issPath) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          } else {
            Write-Error "ISS-Datei nicht gefunden: $issPath"
            exit 1
          }

      # ✅ Version automatisch erkennen
      - name: Extract version
        id: version
        shell: powershell
        run: |
          $files = Get-ChildItem build\installer\*.exe

          if (-not $files) {
            Write-Error "Kein Installer erzeugt!"
            exit 1
          }

          $file = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $name = $file.BaseName

          $numbers = $name -split '_' | Where-Object { $_ -match '^\d+$' }

          if ($numbers.Count -lt 2) {
            Write-Error "Version nicht erkannt"
            exit 1
          }

          $version = "$($numbers[-2]).$($numbers[-1]).0"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      # ✅ Release erstellen
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: build\installer\*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Optional: Artifact
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: manifest_installer
          path: build\installer\*.exe