name: Build Manifest Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Clean build
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Build EXE
        run: pyinstaller --clean --onefile --noconfirm run.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Prepare stage directory with full content
        shell: powershell
        run: |
          $stage = "build\inno_stage"
          New-Item -ItemType Directory -Force $stage | Out-Null

          function Copy-IfExists {
            param(
              [string]$Source,
              [string]$Destination
            )
            if (Test-Path $Source) {
              Copy-Item $Source $Destination -Recurse -Force
            }
          }

          function Copy-FileIfExists {
            param(
              [string]$Source,
              [string]$Destination
            )
            if (Test-Path $Source) {
              Copy-Item $Source $Destination -Force
            }
          }

          # Haupt-EXE
          Copy-FileIfExists "dist\run.exe" "$stage\run.exe"

          # Root-Start- und Hilfsdateien
          Copy-FileIfExists "start_manifest_prod.vbs" "$stage\start_manifest_prod.vbs"
          Copy-FileIfExists "start_manifest_prod.bat" "$stage\start_manifest_prod.bat"
          Copy-FileIfExists "setup_start_manifest.bat" "$stage\setup_start_manifest.bat"
          Copy-FileIfExists "run.py" "$stage\run.py"
          Copy-FileIfExists "requirements.txt" "$stage\requirements.txt"
          Copy-FileIfExists "server_pid.txt" "$stage\server_pid.txt"

          # Wichtige Ordner für Offline-/Vollinstallation
          Copy-IfExists "app" "$stage\app"
          Copy-IfExists "tools" "$stage\tools"
          Copy-IfExists "runtime" "$stage\runtime"
          Copy-IfExists "templates" "$stage\templates"
          Copy-IfExists "uploads" "$stage\uploads"
          Copy-IfExists "session_data" "$stage\session_data"

          # venv explizit mitnehmen, falls vorhanden
          Copy-IfExists "venv" "$stage\venv"
          Copy-IfExists ".venv" "$stage\.venv"

          # Optional weitere Projektordner, falls vorhanden
          Copy-IfExists "static" "$stage\static"
          Copy-IfExists "tests" "$stage\tests"
          Copy-IfExists "installer" "$stage\installer"

          # Stage-Inhalt zur Kontrolle ausgeben
          Write-Host "Stage-Verzeichnis vorbereitet:"
          Get-ChildItem $stage -Force

      - name: Build Installer
        shell: powershell
        run: |
          $issPath = "installer/inno/manifest_offline_setup.iss"

          if (Test-Path $issPath) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          } else {
            Write-Error "ISS-Datei nicht gefunden: $issPath"
            exit 1
          }

      - name: Extract version
        id: version
        shell: powershell
        run: |
          $files = Get-ChildItem build\installer\*.exe

          if (-not $files) {
            Write-Error "Kein Installer erzeugt!"
            exit 1
          }

          $file = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $name = $file.BaseName
          $numbers = $name -split '_' | Where-Object { $_ -match '^\d+$' }

          if ($numbers.Count -lt 2) {
            Write-Error "Version nicht erkannt"
            exit 1
          }

          $version = "$($numbers[-2]).$($numbers[-1]).0"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Installer: $($file.Name)"
          Write-Host "Version: $version"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: build\installer\*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: manifest_installer
          path: build\installer\*.exe