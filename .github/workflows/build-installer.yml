name: Build Manifest Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Clean build
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist

      - name: Build EXE
        run: pyinstaller --clean --onefile --noconfirm run.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          if exist installer.iss (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          ) else (
            echo "installer.iss fehlt"
            exit /b 1
          )

      # ✅ ROBUSTE VERSION (neueste Datei + flexible Erkennung)
      - name: Extract version (robust)
        id: version
        shell: powershell
        run: |
          $files = Get-ChildItem build\installer\*.exe

          if (-not $files) {
            Write-Error "Kein Installer gefunden!"
            exit 1
          }

          # Neueste Datei wählen (falls mehrere existieren)
          $file = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          $name = $file.BaseName

          # Zahlen aus Dateiname extrahieren (z.B. manifest_ou_1_2 -> 1,2)
          $numbers = $name -split '_' | Where-Object { $_ -match '^\d+$' }

          if ($numbers.Count -lt 2) {
            Write-Error "Version im Dateinamen nicht erkannt"
            exit 1
          }

          # Version bilden (SemVer-kompatibel)
          $major = $numbers[-2]
          $minor = $numbers[-1]
          $version = "$major.$minor.0"

          echo "VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Installer: $($file.Name)"
          Write-Host "Version: $version"

      # ✅ Release sicher erstellen
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: build\installer\*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer (optional)
        uses: actions/upload-artifact@v4
        with:
          name: manifest_installer
          path: build\installer\*.exe